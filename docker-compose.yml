# Local development dependencies. Ports bind to 127.0.0.1 only, so neither
# service is reachable from the network. The credentials are local-only
# development values. The superuser exists only for first-run bootstrap
# (infra/postgres/init); the application connects as app_runtime and
# migrations run as app_owner, matching .env.example.

services:
  postgres:
    # Postgres 17 with pgvector, pinned. Debian-based for collation parity with
    # managed Postgres.
    image: pgvector/pgvector:0.8.6-pg17-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_owner -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
