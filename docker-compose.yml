# Local development dependencies. Ports bind to 127.0.0.1 only, so neither
# service is reachable from the network. The credentials are local-only
# development values. The superuser exists only for first-run bootstrap
# (infra/postgres/init); the application connects as app_runtime and
# migrations run as app_owner, matching .env.example.

services:
  postgres:
    # Postgres 17 with pgvector, pinned. Debian-based for collation parity with
    # managed Postgres.
    image: pgvector/pgvector:0.8.6-pg17-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_owner -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Self-hosted open-weight model server (Phase 5). DISABLED: it starts only
  # with `docker compose --profile llm-selfhosted up`, needs an NVIDIA GPU, and
  # the platform uses it only with LLM_PROFILE=vllm and LLM_VLLM_ENABLED=true
  # (packages/config/src/llm.ts). It serves the OpenAI-compatible API the
  # provider already speaks. The model must be on the allowlist; the default
  # is the configured large model. Port bound to 127.0.0.1 like the others.
  vllm:
    profiles: ["llm-selfhosted"]
    # vllm/vllm-openai v0.30.0, pinned by digest (Docker Hub, 2026-09-22).
    image: vllm/vllm-openai@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90
    command:
      ["--model", "${LLM_LARGE_MODEL:-Qwen/Qwen3-32B}", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - vllm-models:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  vllm-models:
